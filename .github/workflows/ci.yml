name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # NOTE: job id kept as `lint-typecheck-test` (unchanged) since it's already
  # configured as a required status check on both protected branches. New
  # jobs below (go-lint-build, web-lint-typecheck, schema-drift-check) need
  # to be added as required checks separately after their first run — see
  # docs/documentation_phase0_Meridian.md Section 5 for the exact steps.
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install ruff mypy pytest pydantic

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy libs/schemas

      - name: Test (pytest)
        run: pytest -v

  go-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  web-lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

  schema-drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install pydantic

      - name: Set up Node (for quicktype via npx)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate schemas
        run: bash scripts/generate_schemas.sh

      - name: Fail if generated output differs from committed output
        run: |
          if ! git diff --quiet; then
            echo "Generated schema files are out of date. Run scripts/generate_schemas.sh locally and commit the result."
            git diff
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets (free OSS gitleaks, no license needed)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo" --no-git -v
