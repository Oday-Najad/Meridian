name: meridian

# NOTE (ADR-0002): Postgres/Auth/Storage are now provided by Supabase.
# For local dev, run `supabase start` (Supabase CLI) separately -- it manages
# its own Docker containers for Postgres+pgvector, Auth (GoTrue), and Storage.
# This compose file only owns what Supabase doesn't provide.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # --- Services below are placeholders, wired up as we build each phase ---
  # gateway:
  #   build: ../../services/gateway
  #   env_file: ../../.env
  #   ports:
  #     - "8080:8080"
  #
  # matching-engine:
  #   build: ../../services/matching-engine
  #   env_file: ../../.env

volumes:
  ollama_data:
